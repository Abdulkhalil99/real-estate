# docker-compose.dev.yml
# Use this during development: docker compose -f docker-compose.dev.yml up
# This starts ONLY the database and pgAdmin — NOT the backend.
# Run the backend separately with: npm run dev:backend

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: real_estate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: real_estate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - real-estate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_estate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: real_estate_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@realestate.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - real-estate-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  real-estate-network:
    driver: bridge