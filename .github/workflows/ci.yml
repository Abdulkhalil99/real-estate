name: CI Pipeline

# ─── WHEN TO RUN ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ─── JOBS ─────────────────────────────────────────────────────────────────────
# Each job runs in its own fresh virtual machine on GitHub's servers

jobs:

  # ── JOB 1: Lint & Type Check ────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest   # GitHub gives us a free Ubuntu machine

    steps:
      # Step 1 — Download our code onto the GitHub machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      # Step 3 — Install dependencies
      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci   # ci = clean install, faster and stricter than npm install

      # Step 4 — Run ESLint
      - name: Run ESLint
        working-directory: apps/backend
        run: npx eslint src/ --max-warnings=0
        # --max-warnings=0 means even warnings fail the pipeline

      # Step 5 — Check TypeScript types (don't compile, just check)
      - name: TypeScript type check
        working-directory: apps/backend
        run: npx tsc --noEmit

  # ── JOB 2: Tests ────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint   # only run if lint job passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      # Run Jest and collect coverage report
      - name: Run tests
        working-directory: apps/backend
        run: npm test -- --coverage --passWithNoTests
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_for_ci_only
          PORT: 5000

      # Upload coverage report so you can see it in GitHub UI
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()   # upload even if tests fail — so you can debug
        with:
          name: coverage-report
          path: apps/backend/coverage/
          retention-days: 7

  # ── JOB 3: Build ────────────────────────────────────────────────────────────
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test   # only run if tests passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      # Compile TypeScript to JavaScript
      - name: Build TypeScript
        working-directory: apps/backend
        run: npm run build

      # Save the compiled dist/ folder for the Docker job
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          retention-days: 1

  # ── JOB 4: Docker Build ─────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build   # only run if build passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx (advanced builder with caching support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      # github.actor = your GitHub username, automatically available
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # GITHUB_TOKEN is automatically created by GitHub — no setup needed

      # Generate image tags
      # On main branch: tag as "latest" AND with the commit SHA (e.g. sha-a1b2c3d)
      # On other branches: tag with branch name
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build the Docker image (and push only on main branch)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs — makes builds ~3x faster
          cache-from: type=gha
          cache-to: type=gha,mode=max