name: CI/CD Pipeline

# Runs on every push to main and develop, and on pull requests to main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new one starts (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── JOB 1: Lint backend ───────────────────────────────────────────────────
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run ESLint
        working-directory: apps/backend
        run: npx eslint src/ --max-warnings=0

      - name: TypeScript check
        working-directory: apps/backend
        run: npx tsc --noEmit

  # ── JOB 2: Test backend ───────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend

    # Spin up a real PostgreSQL for tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB:       real_estate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/real_estate_test

      - name: Run migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/real_estate_test

      - name: Run tests
        working-directory: apps/backend
        run: npm test -- --coverage --passWithNoTests
        env:
          NODE_ENV:              test
          DATABASE_URL:          postgresql://postgres:testpassword@localhost:5432/real_estate_test
          JWT_SECRET:            test_secret_for_ci_only_min_32_chars
          JWT_REFRESH_SECRET:    test_refresh_secret_for_ci_only_32c
          JWT_EXPIRES_IN:        15m
          JWT_REFRESH_EXPIRES_IN: 30d
          PORT:                  5000

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 7

  # ── JOB 3: Build backend ──────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Build TypeScript
        working-directory: apps/backend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          retention-days: 1

  # ── JOB 4: Build frontend ─────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build Next.js
        working-directory: apps/frontend
        run: npm run build
        env:
          # Use placeholder URLs for build — real URLs injected at runtime
          NEXT_PUBLIC_API_URL:    http://localhost:5000/api/v1
          NEXT_PUBLIC_UPLOAD_URL: http://localhost:5000

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/.next/
          retention-days: 1

  # ── JOB 5: Docker backend ─────────────────────────────────────────────────
  docker-backend:
    name: Docker Backend
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context:    apps/backend
          file:       apps/backend/Dockerfile
          push:       ${{ github.ref == 'refs/heads/main' }}
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── JOB 6: Docker frontend ────────────────────────────────────────────────
  docker-frontend:
    name: Docker Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context:    apps/frontend
          file:       apps/frontend/Dockerfile
          push:       ${{ github.ref == 'refs/heads/main' }}
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
            NEXT_PUBLIC_UPLOAD_URL=http://localhost:5000
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── JOB 7: Deploy (mock — runs only on main) ──────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend   | ghcr.io/${{ github.repository }}/backend:latest  | Pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend  | ghcr.io/${{ github.repository }}/frontend:latest | Pushed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      # ── REAL DEPLOY: uncomment and add SSH_HOST + SSH_KEY to GitHub Secrets
      # - name: Deploy to server via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host:     ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key:      ${{ secrets.SSH_KEY }}
      #     script: |
      #       cd /opt/real-estate-platform
      #       echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #       docker compose pull
      #       docker compose up -d --remove-orphans
      #       docker system prune -f

      - name: Deployment complete
        run: echo "Deployment pipeline complete. Images ready in GHCR."
